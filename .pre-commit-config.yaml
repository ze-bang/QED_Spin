# https://pre-commit.com
# Install once:  pip install pre-commit && pre-commit install
# Run on demand: pre-commit run --all-files
# CI runs the same hooks on every push and pull request (.github/workflows/ci.yml, job "lint").
#
# The tree was brought to these hooks in one format-only commit (listed in .git-blame-ignore-revs,
# so `git blame` skips it). Pinned versions: a newer clang-format or ruff can format differently.

minimum_pre_commit_version: "3.5.0"

repos:
  # ---------------------------------------------------------------------------
  # Generic safety nets
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1024']   # the golden references and grid baselines are 0.55-0.85 MB
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-symlinks
      - id: destroyed-symlinks

  # ---------------------------------------------------------------------------
  # C++ / CUDA formatting (.clang-format)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v17.0.6
    hooks:
      - id: clang-format
        types_or: [c, c++, cuda]
        files: \.(h|hpp|cpp|cu|cuh)$

  # ---------------------------------------------------------------------------
  # Python lint and formatting (pyproject.toml [tool.ruff])
  # ---------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
