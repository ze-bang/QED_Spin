[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "qed"
version = "0.7.0"
description = "Modern Python interface to the C++ exact-diagonalization engine (QED)"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Zhengbang Zhou" },
]
keywords = [
    "exact-diagonalization",
    "quantum",
    "lanczos",
    "ftlm",
    "ltlm",
    "spin",
    "condensed-matter",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.21",
]

[project.optional-dependencies]
symmetry = ["pynauty"]                 # qed.find_symmetries / Symmetry(spatial="auto")
test = ["pytest>=7", "pytest-xdist", "pynauty", "scipy"]   # scipy: the grid's dense oracle (support/oracle.py)
docs = ["sphinx>=7.2,<9", "furo>=2024.1", "breathe>=4.35", "myst-parser>=2.0"]   # docs/conf.py's extensions
dev = [
    "pytest>=7",
    "pytest-xdist",
    "pynauty",
    "scipy",
    "ruff",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/ze-bang/QED_Spin"
Documentation = "https://ze-bang.github.io/QED_Spin/"
Repository = "https://github.com/ze-bang/QED_Spin"

# -----------------------------------------------------------------------------
# scikit-build-core configuration.
#
# We point CMake at the project root (where the top-level CMakeLists.txt
# lives) and force ED_BUILD_PYTHON=ON. The C++ tests are deliberately
# turned off in wheel builds to keep the wheel slim and the CI fast.
# -----------------------------------------------------------------------------
[tool.scikit-build]
cmake.version = ">=3.18"
cmake.build-type = "Release"
build-dir = "build/python-{build_type}"
wheel.packages = ["python/qed"]
wheel.install-dir = "."
wheel.exclude = ["**/__pycache__/**", "**/*.pyc"]
sdist.include = [
    "include",
    "src",
    "cmake",
    "python/qed",
    "CMakeLists.txt",
    "pyproject.toml",
    "README.md",
    "LICENSE",
]
sdist.exclude = [
    "build",
    ".git",
    "**/__pycache__",
    "**/*.so",
]

[tool.scikit-build.cmake.define]
ED_BUILD_PYTHON = "ON"
BUILD_ED_TESTS = "OFF"
WITH_CUDA = "OFF"

# -----------------------------------------------------------------------------
# Tooling: ruff (linter) + pytest defaults.
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests/python"]
python_files = ["test_*.py"]
# Skip the long-running perf/scale guards, the grid and the regress ratchet by default (select
# them with -m; the gate runs the grid and regress shards from scripts/gate/tasks.sh).
addopts = "-q -m 'not slow and not grid and not regress'"
markers = [
    "slow: long-running performance / scale guard (deselected by default; run by hand with -m slow)",
    "grid: task x symmetry x backend coverage grid (run with -m grid; the gate shards it in scripts/gate/tasks.sh)",
    "regress: audit repro ratchet, tests/python/regress (run with -m 'regress and not perf and not info')",
    "perf: regress case for a confirmed performance issue (non-blocking bench stage)",
    "info: regress case that is inconclusive, not reproduced or an elegance note",
    "gpu: needs a CUDA device; skipped without one",
]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["build", "_deps"]

[tool.ruff.format]
quote-style = "preserve"     # the tree mixes both; the format pass changes layout only

[tool.ruff.lint]
# pyflakes, pycodestyle and bugbear; import order (I) is meaningful in qed/__init__.py and the test
# conftest, and pyupgrade (UP) is churn at py39.
select = ["E", "F", "W", "B"]
ignore = [
    "E501",   # line length: the formatter's
    "E731",   # a lambda bound to a name
    "E741",   # O, I, l: operators, identities and sites in physics notation
    "E402",   # imports after sys.path set-up (tests, scripts, examples)
    "B023",   # closures over a loop variable that are called within the same iteration
    "B904",   # exception chaining is not part of the API
    "B019",   # lru_cache on methods of long-lived objects (symmetry groups, models)
]
