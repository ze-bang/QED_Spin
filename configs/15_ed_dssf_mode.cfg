# =============================================================================
# `ED dssf` SUBCOMMAND - Canonical Spectral / Static Structure-Factor CLI
# =============================================================================
#
# As of P2.14 every dynamical and static structure-factor calculation routes
# through the `ED dssf <method>` subcommand, which dispatches into the
# canonical `ed::dssf::run(...)` engine seam shared by the C++ CLI and the
# Python `quantum_ed.dssf` bindings.
#
# The historical `TPQ_DSSF` standalone binary and the deprecated
# `--dssf <dir> <krylov> <ops>` half-positional flag (both ~4.5 kLOC of
# duplicated UI on top of the same compute_*_workflow kernels) have been
# removed; this config shows the modern workflow.
#
# =============================================================================
# STEP 1: Generate eigenstates / TPQ states (run this config)
# =============================================================================
#
#   ./ED configs/15_ed_dssf_mode.cfg
#
# Writes ground-state eigenvector(s) into `./my_system/output/ed_results.h5`,
# which the `dssf` subcommand will pick up in step 2.
#
# =============================================================================

[System]
hamiltonian_dir = ./my_system
num_sites = 16
spin_length = 0.5
sublattice_size = 4
use_fixed_sz = true
n_up = 8

[Diagonalization]
method = LANCZOS
num_eigenvalues = 1
tolerance = 1e-12
compute_eigenvectors = true              # required for dssf

[Output]
output_dir = ./my_system/output


# =============================================================================
# STEP 2: Run `ED dssf <method> <directory>`
# =============================================================================
#
# Generic syntax:
#
#   ./ED dssf <method> <directory> [options]
#
# Available methods:
#
#   dynamical_thermal    Finite-T S(Q,ω) via FTLM continued fraction.
#   static_thermal       Finite-T S(Q) (no ω axis), FTLM thermal averaging.
#   ground_state_dssf    T=0 S(Q,ω) via Lanczos + continued fraction.
#   single_expectation   Single ⟨ψ|O|ψ⟩ (no Hermitian conjugate).
#
# Per-method knobs reuse the standard `--dyn-*` / `--static-*` /
# `--gs-dssf-*` flags parsed by `EDConfig::fromCommandLine`. The same flags
# can also live in a config file under [DynamicalResponse] / [StaticResponse].
#
# -----------------------------------------------------------------------------
# Common knobs (subset; run `./ED --help` for the full list)
# -----------------------------------------------------------------------------
#
#   --dyn-omega-min=<f>           ω window minimum
#   --dyn-omega-max=<f>           ω window maximum
#   --dyn-omega-points=<n>        Number of frequency points
#   --dyn-broadening=<η>          Lorentzian broadening
#   --dyn-temp-min/--max/--bins   Log-spaced temperature scan
#   --dyn-samples=<n>             FTLM random samples (default: 40)
#   --dyn-operator-type=<type>    sum | transverse | sublattice | experimental
#   --dyn-basis=<basis>           ladder (Sp/Sm/Sz) | xyz (Sx/Sy/Sz)
#   --dyn-spin-combinations=<s>   "op1,op2;op3,op4" pair list
#   --dyn-momentum-points=<pts>   "Qx,Qy,Qz;..." in units of π
#   --dyn-polarization=<v>        For transverse operators
#   --dyn-theta=<θ>               For experimental operators
#   --use-gpu / --dyn-use-gpu     GPU acceleration
#   --n-up=<n>                    Fixed-Sz sector
#
# (Identical knobs exist with the `--static-` prefix for the static workflow.)
#
# -----------------------------------------------------------------------------
# EXAMPLE COMMANDS
# -----------------------------------------------------------------------------
#
# Example 1 -- T=0 ground-state DSSF (SzSz at Q=0)
#   ./ED dssf ground_state_dssf ./my_system \
#       --gs-dssf-spin-combinations="2,2" \
#       --gs-dssf-omega-min=0 --gs-dssf-omega-max=10 \
#       --gs-dssf-omega-points=500 --gs-dssf-broadening=0.05
#
# Example 2 -- Finite-T DSSF with FTLM averaging over multiple Q-points
#   ./ED dssf dynamical_thermal ./my_system \
#       --dyn-spin-combinations="0,1;2,2" \
#       --dyn-momentum-points="0,0,0;0.5,0.5,0;1,0,0" \
#       --dyn-omega-min=-5 --dyn-omega-max=5 --dyn-omega-points=200 \
#       --dyn-broadening=0.1 \
#       --dyn-temp-min=0.1 --dyn-temp-max=10 --dyn-temp-bins=20 \
#       --dyn-samples=40
#
# Example 3 -- Static structure factor (SSSF) vs temperature
#   ./ED dssf static_thermal ./my_system \
#       --static-spin-combinations="0,0;1,1;2,2" \
#       --static-momentum-points="0,0,0;0.5,0.5,0;1,0,0" \
#       --static-temp-min=0.01 --static-temp-max=5.0 \
#       --static-temp-points=50 --static-samples=40
#
# Example 4 -- Transverse operator for neutron scattering
#   ./ED dssf dynamical_thermal ./my_system \
#       --dyn-operator-type=transverse --dyn-basis=xyz \
#       --dyn-spin-combinations="0,0;1,1;2,2" \
#       --dyn-polarization="1,-1,0" \
#       --dyn-momentum-points="0,0,0;0.5,0.5,0.5"
#
# Example 5 -- GPU-accelerated finite-T DSSF
#   ./ED dssf dynamical_thermal ./my_system \
#       --dyn-spin-combinations="0,1;2,2" \
#       --dyn-temp-min=0.1 --dyn-temp-max=5.0 --dyn-temp-bins=30 \
#       --dyn-samples=50 --use-gpu
#
# =============================================================================
# OUTPUT
# =============================================================================
#
# Results land in `<directory>/output/dssf_*.h5` (and also under
# `/dynamical/<op>/...` / `/correlations/<op>/...` inside `ed_results.h5`
# for backwards-compatible post-processing scripts).
#
# The unified `/dssf/...` HDF5 schema is documented in
# `include/ed/dssf/dssf_io.h`.
#
# =============================================================================
