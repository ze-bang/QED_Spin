# =============================================================================
# THERMAL HALL: Energy Current Cross-Correlator for kappa_xy
# =============================================================================
#
# Computes S_{JEx,JEy}(omega,T) = <JEx†(t) JEy> using FTLM
# for the thermal Hall conductivity on 16-site pyrochlore (QSI parameters).
#
# Usage: ./ED configs/kappa_xy_pyro16.cfg
#
# =============================================================================

[System]
hamiltonian_dir = ./test_pyro16_qsi_kappa
num_sites = 16
spin_length = 0.5
sublattice_size = 4
use_fixed_sz = false

[Workflow]
compute_dynamical_response = true
output_dir = ./test_pyro16_qsi_kappa/output

[DynamicalResponse]
compute = true
thermal_average = true
use_gpu = false

# Sampling parameters
num_samples = 30
krylov_dim = 300
random_seed = 42

# Frequency grid — energy scale set by J_zz = 1
omega_min = -3.0
omega_max = 3.0
num_omega_points = 1200

# Broadening
broadening = 0.05

# Temperature scan — focus on low T where QSI physics lives
temp_min = 0.05
temp_max = 0.5
num_temp_bins = 5

# Legacy mode: two-operator cross-correlation
compute_correlation = true
operator_file = JEx.dat
operator2_file = JEy.dat

# Output
output_prefix = kappa_xy
