# =============================================================================
# THERMAL HALL: Energy Current Cross-Correlator for kappa_xy
# =============================================================================
# Minimal config - legacy operator loading via --dyn-operator CLI args
# =============================================================================

[System]
hamiltonian_dir = ./test_pyro16_qsi_kappa
num_sites = 16
spin_length = 0.5
use_fixed_sz = false

[Workflow]
compute_dynamical_response = true
output_dir = ./test_pyro16_qsi_kappa/output

[DynamicalResponse]
compute = true
thermal_average = true
use_gpu = false
num_samples = 10
krylov_dim = 200
random_seed = 42
omega_min = -3.0
omega_max = 3.0
num_omega_points = 600
broadening = 0.1
temp_min = 0.1
temp_max = 0.5
num_temp_bins = 3
